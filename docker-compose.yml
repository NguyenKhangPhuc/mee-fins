services:
  # 1. Database Service
  postgres:
    image: postgres:16-alpine
    container_name: meefins-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - webnet

  # 2. Redis Cache & Queue Service
  redis:
    image: redis:7-alpine
    container_name: meefins-redis
    restart: unless-stopped
    env_file:
      - .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - webnet

  # 3. NestJS Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-nguyenkhangphuc/meefins-backend:latest}
    container_name: meefins-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - webnet

  # 4. LiveKit WebRTC Server Service (Using host networking to prevent docker-proxy 10,000 UDP port deadlock)
  livekit:
    image: livekit/livekit-server:v1.8.0
    container_name: meefins-livekit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_EXTERNAL_IP: "${LIVEKIT_EXTERNAL_IP}"
    command: --config /config/livekit.yaml
    volumes:
      - ./livekit.yaml:/config/livekit.yaml
    network_mode: host

  # 5. Caddy Reverse Proxy & Automatic HTTPS Service
  caddy:
    image: caddy:2.8-alpine
    container_name: meefins-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  pgdata:
  redis-data:
  caddy_data:
  caddy_config:
