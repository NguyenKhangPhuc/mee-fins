name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  # ==========================================
  # STAGE 1: DOCKER IMAGE BUILD & PUSH
  # ==========================================

  build-docker:
    # Purpose: Builds the application Docker image and pushes it to Docker Hub.
    # Rationale: Packages the app into a reproducible container image tagged with the commit SHA for traceability.
    # Dependencies: None. Runs immediately on push.
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/meefins-backend:sha-${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/meefins-backend:latest

  # ==========================================
  # STAGE 2: DEPLOYMENT
  # ==========================================

  deploy:
    # Purpose: Pulls the new Docker image and restarts the services on the remote server.
    # Rationale: Synchronizes the remote production server with the latest verified container image.
    # Dependencies: Requires successful execution of the build-docker job.
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH and Deploy
        run: |
          # Setup SSH directory and populate private key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Initialize ssh-agent and add deployment private key
          eval $(ssh-agent -s)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | ssh-add -
          
          # Add jump host private key if jump host is used
          if [ -n "${{ secrets.SSH_JUMP_KEY }}" ]; then
            echo "${{ secrets.SSH_JUMP_KEY }}" | tr -d '\r' | ssh-add -
          fi

          # Construct SSH command with Jump Host option if applicable
          SSH_OPTS="-o StrictHostKeyChecking=no"
          if [ -n "${{ secrets.SSH_JUMP_HOST }}" ]; then
            SSH_OPTS="$SSH_OPTS -J ${{ secrets.SSH_JUMP_USER }}@${{ secrets.SSH_JUMP_HOST }}"
          fi

          # Define the target image using the unique commit SHA tag
          DOCKER_IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/meefins-backend:sha-${{ github.sha }}"

          # Create deployment script locally with proper YAML indentation
          cat << 'DEPLOY_SCRIPT' > /tmp/deploy.sh
          cd /home/ubuntu/mee-fins

          cat << 'ENVFILE' > .env
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}

          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

          LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}
          LIVEKIT_EXTERNAL_IP=${{ secrets.SSH_HOST }}

          PORT=${{ secrets.PORT }}
          NODE_ENV=${{ secrets.NODE_ENV }}

          CLOUDFLARE_R2_ACCOUNT_ID=${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_NAME=${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL=${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY=${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ACCESS_KEY_ID=${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}

          FRONTEND_URL=${{ secrets.FRONTEND_URL }}

          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          MAIL_FROM="${{ secrets.MAIL_FROM }}"

          GITHUB_CLIENT_ID=${{ secrets.CLIENT_GITHUB_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.CLIENT_GITHUB_SECRET }}
          GITHUB_CALLBACK_URL=${{ secrets.CALLBACK_URL_GITHUB }}

          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          ENVFILE

          sed -i 's/^[ \t]*//' .env
          export DOCKER_IMAGE="$DOCKER_IMAGE"
          git pull origin main
          docker compose pull
          docker compose down
          docker compose up -d --no-build
          DEPLOY_SCRIPT

          # Remove YAML indentation spaces from deployment script before executing via SSH
          sed -i 's/^[ \t]*//' /tmp/deploy.sh
          ssh $SSH_OPTS ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' < /tmp/deploy.sh

  # ==========================================
  # STAGE 3: VERSIONING & RELEASE
  # ==========================================

  release:
    # Purpose: Tags the Git repository and publishes a GitHub release.
    # Rationale: Seals the release pipeline and creates a traceable version log linked to the live production build.
    # Dependencies: Requires successful execution of the deploy job.
    name: Auto-Versioning & Release
    needs: [deploy]
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: Bump version and push tag
      uses: anothrNick/github-tag-action@8c8163ef62cf9c4677c8e800f36270af27930f42 # Don't use @master or @v1 unless you're happy to test the latest version
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }} # if you don't want to set write permissions use a PAT token
        WITH_V: false
        DEFAULT_BUMP: patch
